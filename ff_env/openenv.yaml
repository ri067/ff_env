spec_version: 1
name: ff_env
type: space
runtime: fastapi
app: server.app:app
port: 8000
description: Financial Fraud Detection Environment where an AI agent audits synthetic company financial statements to detect accounting fraud patterns.
tags:
  - openenv
  - finance
  - fraud-detection
tasks:
  - name: easy
    description: One fraud injected - revenue inflation. Agent must identify and flag it.
    difficulty: easy
    max_steps: 15
    reward_range: [0.0, 1.0]
  - name: medium
    description: Two frauds injected across statements. Agent must find both.
    difficulty: medium
    max_steps: 20
    reward_range: [0.0, 1.0]
  - name: hard
    description: Three layered frauds with red herrings. Requires cross-statement reasoning.
    difficulty: hard
    max_steps: 25
    reward_range: [0.0, 1.0]
